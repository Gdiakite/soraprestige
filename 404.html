<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — SoraPrestige</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(60% 50% at 80% 10%, rgba(212,178,106,.16), transparent 70%), #0A0E17; color: #F5F1E8; font: 400 16px/1.6 Inter, system-ui, sans-serif; text-align: center; }
main { max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.code { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(72px, 18vw, 120px); line-height: 1; color: transparent; -webkit-text-stroke: 1px #D4B26A; }
h1 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: clamp(26px, 5vw, 36px); }
p { margin: 0; color: #AEB6C6; }
a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 12px; background: #D4B26A; color: #0A0E17; font-weight: 600; text-decoration: none; }
a:hover { background: #E8D09A; }
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Cette page a changé de cap.</h1>
  <p>La page demandée n'existe pas ou a été déplacée. Revenez à l'accueil pour préparer votre prochain voyage.</p>
  <a href="/">Retour à l'accueil</a>
</main>
</body>
</html>
