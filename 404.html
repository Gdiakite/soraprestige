<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EEE4">
<title>Page introuvable — SoraPrestige</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Instrument+Sans:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F3EEE4; color: #16130E; font: 400 17px/1.6 'Instrument Sans', system-ui, sans-serif; text-align: center; }
main { max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.code { font: italic 400 clamp(96px, 24vw, 180px)/0.9 'Bodoni Moda', Georgia, serif; color: #8B5E34; }
h1 { margin: 0; font: 400 clamp(30px, 6vw, 46px)/1.1 'Bodoni Moda', Georgia, serif; letter-spacing: -0.01em; }
p { margin: 0; color: #3B352C; }
a { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; background: #16130E; color: #F3EEE4; font-weight: 500; letter-spacing: .04em; text-decoration: none; }
a:hover { background: #8B5E34; }
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Cette page a changé de cap.</h1>
  <p>La page demandée n'existe pas ou a été déplacée. Revenez à l'accueil pour préparer votre prochain voyage.</p>
  <a href="/">Retour à l'accueil <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
